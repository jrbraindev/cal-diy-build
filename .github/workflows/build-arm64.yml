name: Build Cal.diy ARM64

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Select standard production build or isolated standalone runtime experiment"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - runtime-poc

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Cal.diy (standard build only)
        if: ${{ inputs.build_variant == 'standard' }}
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: main
          path: cal-diy

      - name: Checkout build repository (runtime experiment only)
        if: ${{ inputs.build_variant == 'runtime-poc' }}
        uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:arm64" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish standard ARM64
        if: ${{ inputs.build_variant == 'standard' }}
        uses: docker/build-push-action@v6
        with:
          context: ./cal-diy
          file: ./cal-diy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.braindev.com.br
            MAX_OLD_SPACE_SIZE=6144

      - name: Build and publish experimental ARM64 runtime (non-production tag)
        if: ${{ inputs.build_variant == 'runtime-poc' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime-poc
          platforms: linux/arm64
          push: true
          tags: ghcr.io/jrbraindev/cal-diy-build:arm64-runtime-poc-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=EXPERIMENTAL standalone runtime only; skips migrations and seed; never deploy directly to production
