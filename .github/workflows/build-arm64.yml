
name: Build Cal.diy ARM64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Cal.diy
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: main
          path: cal-diy

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:arm64" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./cal-diy
          file: ./cal-diy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://agenda.braindev.com.br
            MAX_OLD_SPACE_SIZE=6144
